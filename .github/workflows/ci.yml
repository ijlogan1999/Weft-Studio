name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (core, engine, plugins, relay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev xvfb xauth

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache fetched C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-linux-${{ hashFiles('third_party/cpp-deps.json') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test (C++)
        run: ctest --test-dir build --output-on-failure

      - name: CRDT load benchmark (Release, 200k notes in at most 3 s)
        env:
          WEFT_BENCH_ENFORCE: "1"
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEFT_WITH_JUCE=OFF
          cmake --build build-release --target weft_bench_tests --parallel
          ./build-release/tests/weft_bench_tests

      - name: Test (Rust)
        run: cargo test --workspace --locked

      - name: Relay capacity (Release, 50 rooms x 8 clients on 2 workers)
        run: cargo test --release --locked -p weft-relay --test load -- --ignored --nocapture

      - name: Rust lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked -- -D warnings

  windows:
    name: Windows (full build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Cache fetched C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-windows-${{ hashFiles('third_party/cpp-deps.json') }}

      - name: Configure
        # No explicit generator: CMake picks the newest installed Visual Studio, x64 by default.
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WeftStudio-windows-debug
          path: build/app/WeftStudio_artefacts/Debug/
          if-no-files-found: error

  installer:
    name: Windows installer (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Cache fetched C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-windows-release-${{ hashFiles('third_party/cpp-deps.json') }}

      - name: Configure
        run: cmake -S . -B build -DWEFT_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target WeftStudio

      - name: Package
        working-directory: build
        run: cpack -C Release -B "${{ runner.temp }}/package"

      - name: Install, check and uninstall silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem "${{ runner.temp }}/package/WeftStudio-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer was built" }
          $dir = Join-Path "${{ runner.temp }}" "Weft Studio"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          foreach ($f in "Weft Studio.exe", "weft-plugin-scanner.exe", "vcruntime140.dll", "LICENSE", "ThirdPartyNotices.txt", "Uninstall.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          Start-Process -FilePath (Join-Path $dir "Uninstall.exe") -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path (Join-Path $dir "Weft Studio.exe")) { throw "the uninstaller left the app behind" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WeftStudio-windows-installer
          path: |
            ${{ runner.temp }}/package/WeftStudio-*.exe
            ${{ runner.temp }}/package/WeftStudio-*.zip
          if-no-files-found: error
