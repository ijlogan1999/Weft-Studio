[package]
name = "weft-codec"
version = "0.1.0"
description = "C ABI over the LAME MP3 encoder (and an MP3 decoder used to check bounces) for Weft Studio"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
mp3lame-sys = "0.1.11"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
