[workspace]
resolver = "2"
members = ["crates/weft-crdt", "crates/weft-codec", "crates/weft-ffi", "relay"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"
publish = false

[workspace.dependencies]
automerge = "0.12"
blake3 = { version = "1", features = ["pure"] }

[profile.release]
debug = 1

# Debug builds still optimize dependencies (Automerge), so engine and document
# tests run at realistic speed. Weft's own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
